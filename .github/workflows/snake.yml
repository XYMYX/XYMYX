name: snake

on:
  schedule:
    - cron: "17 3 * * *"   # once a day
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write           # only this repo, only to push the output branch

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Platane/snk v3.5.0, pinned to the exact commit instead of a movable tag
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#000000&color_dots=#ebedf0,#c4c4c4,#8a8a8a,#4a4a4a,#000000
            dist/github-snake-dark.svg?color_snake=#ffffff&color_dots=#161b22,#3d3d3d,#7a7a7a,#b8b8b8,#ffffff

      # push the two SVGs to the "output" branch with plain git, no extra action
      - name: Push to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "update snake"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
